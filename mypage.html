<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 — MOMENTO</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    window._user = user;
    document.getElementById('userName').textContent = user.displayName || user.email.split('@')[0];
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('userAvatar').textContent = (user.displayName||'U')[0].toUpperCase();

    // Firestore 유저 정보
    const uSnap = await getDoc(doc(db,'users',user.uid));
    if(uSnap.exists()){
      const data = uSnap.data();
      document.getElementById('userGrade').textContent = data.role==='admin'?'관리자':data.totalOrders>10?'VIP':'일반';
      if(data.role==='admin') document.getElementById('adminBtn').style.display='flex';
    }

    // 주문 내역 로드
    try {
      const ordSnap = await getDocs(query(collection(db,'users',user.uid,'orders'),orderBy('createdAt','desc')));
      renderOrders(ordSnap.docs.map(d=>({id:d.id,...d.data()})));
    } catch(e){ renderOrders([]); }

    // 장바구니 로드
    try {
      const cartSnap = await getDocs(collection(db,'users',user.uid,'cart'));
      renderCart(cartSnap.docs.map(d=>({id:d.id,...d.data()})));
    } catch(e){ renderCart([]); }
  });

  window._doSignOut = async () => { await signOut(auth); window.location.href='index.html'; };
</script>
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--surface3:#242424;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--gold:#d4a843;--gold-light:#e8c87d;--gold-dim:rgba(212,168,67,.12);--text:#f0ede8;--text2:#a8a5a0;--text3:#666;--radius:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

/* TOP NAV */
.topnav{background:rgba(10,10,10,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Playfair Display',serif;font-size:22px;letter-spacing:5px;color:var(--gold);text-decoration:none;}
.nav-right{display:flex;gap:12px;align-items:center;}
.nav-link{color:var(--text2);text-decoration:none;font-size:13px;transition:color .2s;}
.nav-link:hover{color:var(--text);}
.btn-sm{background:none;border:1px solid var(--border2);color:var(--text2);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s;}
.btn-sm:hover{border-color:var(--gold);color:var(--gold);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:260px 1fr;gap:24px;max-width:1200px;margin:0 auto;padding:32px 24px;}

/* SIDEBAR */
.sidebar{position:sticky;top:80px;align-self:start;}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:16px;}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--gold-dim);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--gold);font-weight:700;margin:0 auto 12px;}
.profile-name{font-size:16px;font-weight:700;margin-bottom:4px;}
.profile-email{font-size:12px;color:var(--text3);margin-bottom:8px;}
.profile-grade{display:inline-block;background:var(--gold-dim);color:var(--gold);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;margin-bottom:16px;}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pstat{background:var(--surface2);border-radius:8px;padding:12px;text-align:center;}
.pstat-num{font-size:20px;font-weight:700;color:var(--gold);}
.pstat-label{font-size:11px;color:var(--text3);margin-top:2px;}
.sidebar-nav{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.snav-item{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:13px;color:var(--text2);}
.snav-item:hover{background:var(--surface2);color:var(--text);}
.snav-item.active{color:var(--gold);border-left-color:var(--gold);background:var(--gold-dim);}
.snav-divider{height:1px;background:var(--border);}
#adminBtn{display:none;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:13px;color:var(--gold);background:var(--gold-dim);}
#adminBtn:hover{background:rgba(212,168,67,.2);}

/* CONTENT */
.content{display:flex;flex-direction:column;gap:20px;}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.sc-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sc-title{font-size:15px;font-weight:700;}
.sc-action{font-size:12px;color:var(--gold);cursor:pointer;}
.sc-body{padding:24px;}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:0;}
.tab{padding:12px 20px;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ORDER LIST */
.order-empty{text-align:center;padding:60px 20px;color:var(--text3);}
.order-empty-icon{font-size:48px;margin-bottom:12px;}
.order-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.order-hd{background:var(--surface2);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text3);}
.order-id{font-weight:500;color:var(--text2);}
.order-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.status-making{background:rgba(250,204,21,.1);color:#facc15;}
.status-done{background:rgba(74,222,128,.1);color:#4ade80;}
.status-shipping{background:rgba(96,165,250,.1);color:#60a5fa;}
.status-review{background:rgba(251,146,60,.1);color:#fb923c;}
.order-body{padding:16px;display:flex;gap:16px;align-items:center;}
.order-icon{font-size:40px;width:60px;text-align:center;}
.order-info{flex:1;}
.order-name{font-size:14px;font-weight:500;margin-bottom:4px;}
.order-detail{font-size:12px;color:var(--text3);}
.order-price{font-size:15px;font-weight:700;color:var(--gold);}
.order-actions{display:flex;gap:8px;}
.order-btn{border:1px solid var(--border2);background:none;color:var(--text2);border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit;}
.order-btn:hover{border-color:var(--gold);color:var(--gold);}

/* CART */
.cart-item{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);}
.cart-item:last-child{border-bottom:none;}
.cart-icon{font-size:36px;width:52px;text-align:center;background:var(--surface2);border-radius:8px;height:52px;display:flex;align-items:center;justify-content:center;}
.cart-info{flex:1;}
.cart-name{font-size:13px;font-weight:500;margin-bottom:4px;}
.cart-opt{font-size:11px;color:var(--text3);}
.cart-price{font-size:14px;font-weight:700;color:var(--gold);}
.cart-rm{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px;transition:color .2s;}
.cart-rm:hover{color:#f87171;}
.cart-total{background:var(--surface2);border-radius:10px;padding:16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;}
.cart-total-label{font-size:14px;color:var(--text2);}
.cart-total-price{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);}
.checkout-btn{width:100%;margin-top:12px;padding:14px;background:var(--gold);border:none;color:#000;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.checkout-btn:hover{background:var(--gold-light);}

/* PROFILE EDIT */
.field{margin-bottom:16px;}
.field-label{display:block;font-size:12px;color:var(--text3);margin-bottom:6px;}
.field-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border .2s;}
.field-input:focus{border-color:var(--gold);}
.save-btn{background:var(--gold);border:none;color:#000;padding:11px 28px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.save-btn:hover{background:var(--gold-light);}

/* BADGE */
.badge-gold{background:var(--gold-dim);color:var(--gold);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--surface2);border:1px solid rgba(212,168,67,.3);border-radius:12px;padding:14px 20px;font-size:13px;transform:translateY(80px);opacity:0;transition:all .4s;}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="nav-logo">MOMENTO</a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">← 쇼핑 계속하기</a>
    <button class="btn-sm" onclick="window._doSignOut&&window._doSignOut()">로그아웃</button>
  </div>
</nav>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="profile-card">
      <div class="avatar" id="userAvatar">U</div>
      <div class="profile-name" id="userName">로딩 중...</div>
      <div class="profile-email" id="userEmail"></div>
      <div class="profile-grade" id="userGrade">일반</div>
      <div class="profile-stats">
        <div class="pstat"><div class="pstat-num" id="statOrders">0</div><div class="pstat-label">주문</div></div>
        <div class="pstat"><div class="pstat-num" id="statPoints">0</div><div class="pstat-label">포인트</div></div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="snav-item active" onclick="showSection('orders',this)">📦 &nbsp;주문 내역</div>
      <div class="snav-item" onclick="showSection('cart',this)">🛒 &nbsp;장바구니</div>
      <div class="snav-item" onclick="showSection('wishlist',this)">❤️ &nbsp;찜 목록</div>
      <div class="snav-item" onclick="showSection('custom',this)">🎨 &nbsp;커스텀 문의</div>
      <div class="snav-item" onclick="showSection('profile',this)">👤 &nbsp;회원 정보</div>
      <div class="snav-divider"></div>
      <div id="adminBtn" onclick="location.href='admin.html'">⚙️ &nbsp;관리자 페이지</div>
      <div class="snav-item" style="color:#f87171" onclick="window._doSignOut&&window._doSignOut()">🚪 &nbsp;로그아웃</div>
    </div>
  </aside>

  <!-- CONTENT -->
  <div class="content">

    <!-- 주문 내역 -->
    <div class="section-card" id="sec-orders">
      <div class="sc-header">
        <div class="sc-title">주문 내역</div>
        <span class="sc-action">전체 보기</span>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="filterOrders('all',this)">전체</button>
        <button class="tab" onclick="filterOrders('making',this)">제작중</button>
        <button class="tab" onclick="filterOrders('shipping',this)">배송중</button>
        <button class="tab" onclick="filterOrders('done',this)">완료</button>
      </div>
      <div class="sc-body" id="orderList">
        <div class="order-empty"><div class="order-empty-icon">📦</div><div>주문 내역이 없습니다</div></div>
      </div>
    </div>

    <!-- 장바구니 -->
    <div class="section-card" id="sec-cart" style="display:none">
      <div class="sc-header"><div class="sc-title">장바구니</div></div>
      <div class="sc-body" id="cartList">
        <div class="order-empty"><div class="order-empty-icon">🛒</div><div>장바구니가 비어있습니다</div></div>
      </div>
    </div>

    <!-- 찜 목록 -->
    <div class="section-card" id="sec-wishlist" style="display:none">
      <div class="sc-header"><div class="sc-title">찜 목록</div></div>
      <div class="sc-body"><div class="order-empty"><div class="order-empty-icon">❤️</div><div>찜한 상품이 없습니다</div></div></div>
    </div>

    <!-- 커스텀 문의 -->
    <div class="section-card" id="sec-custom" style="display:none">
      <div class="sc-header"><div class="sc-title">커스텀 주문 문의</div><span class="sc-action" onclick="location.href='index.html#custom'">새 문의 →</span></div>
      <div class="sc-body"><div class="order-empty"><div class="order-empty-icon">🎨</div><div>진행 중인 커스텀 문의가 없습니다</div></div></div>
    </div>

    <!-- 회원 정보 -->
    <div class="section-card" id="sec-profile" style="display:none">
      <div class="sc-header"><div class="sc-title">회원 정보 수정</div></div>
      <div class="sc-body">
        <div class="field"><label class="field-label">이름</label><input class="field-input" id="editName" placeholder="이름"></div>
        <div class="field"><label class="field-label">이메일</label><input class="field-input" id="editEmail" placeholder="이메일" readonly style="opacity:.5"></div>
        <div class="field"><label class="field-label">연락처</label><input class="field-input" id="editPhone" placeholder="010-0000-0000"></div>
        <div class="field"><label class="field-label">배송지 주소</label><input class="field-input" id="editAddr" placeholder="기본 배송지를 입력하세요"></div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button class="save-btn" onclick="saveProfile()">저장</button>
        </div>
        <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border);">
          <div style="font-size:13px;font-weight:700;margin-bottom:16px;color:#f87171;">위험 구역</div>
          <button style="border:1px solid #f87171;background:none;color:#f87171;border-radius:8px;padding:9px 20px;cursor:pointer;font-family:inherit;font-size:13px;" onclick="showToast('회원 탈퇴는 고객센터에 문의해주세요')">회원 탈퇴</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// 섹션 전환
function showSection(key, el) {
  document.querySelectorAll('[id^="sec-"]').forEach(s=>s.style.display='none');
  document.getElementById('sec-'+key).style.display='block';
  document.querySelectorAll('.snav-item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
  // URL hash
  history.pushState(null,'','#'+key);
}

// hash 처리
if(location.hash) {
  const key = location.hash.replace('#','');
  const el = document.querySelector(`.snav-item[onclick*="${key}"]`);
  showSection(key, el);
}

// 샘플 주문 데이터 (Firebase 연결 전 시연용)
const SAMPLE_ORDERS = [
  {id:'ORD-2847',name:'포토 폰케이스 ×1',icon:'📱',opt:'아이폰 15 / 투명',price:'₩12,900',status:'making',statusLabel:'제작중',date:'2025.07.12'},
  {id:'ORD-2843',name:'프리미엄 포토북 ×1',icon:'📖',opt:'A4 20p / 무선제본',price:'₩24,900',status:'shipping',statusLabel:'배송중',date:'2025.07.10'},
  {id:'ORD-2831',name:'커스텀 머그컵 ×2',icon:'☕',opt:'화이트 / 유광',price:'₩31,800',status:'done',statusLabel:'수령완료',date:'2025.07.01'},
];

function renderOrders(orders) {
  const list = document.getElementById('orderList');
  document.getElementById('statOrders').textContent = orders.length;
  if(orders.length===0){ list.innerHTML='<div class="order-empty"><div class="order-empty-icon">📦</div><div>주문 내역이 없습니다</div></div>'; return; }
  list.innerHTML = orders.map(o=>`
    <div class="order-card">
      <div class="order-hd">
        <span class="order-id">#${o.id}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="color:var(--text3)">${o.date||''}</span>
          <span class="order-status status-${o.status}">${o.statusLabel}</span>
        </div>
      </div>
      <div class="order-body">
        <div class="order-icon">${o.icon}</div>
        <div class="order-info">
          <div class="order-name">${o.name}</div>
          <div class="order-detail">${o.opt||''}</div>
        </div>
        <div style="text-align:right">
          <div class="order-price">${o.price}</div>
          <div class="order-actions" style="margin-top:8px">
            <button class="order-btn">상세 보기</button>
            ${o.status==='done'?'<button class="order-btn">재주문</button>':''}
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// Firebase 미연결 시 샘플 데이터로 시연
window.renderOrders = renderOrders;
setTimeout(()=>{ if(!window._user) renderOrders(SAMPLE_ORDERS); }, 2000);

function filterOrders(status, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const filtered = status==='all' ? SAMPLE_ORDERS : SAMPLE_ORDERS.filter(o=>o.status===status);
  renderOrders(filtered);
}

function renderCart(items) {
  const el = document.getElementById('cartList');
  if(!items||items.length===0){ el.innerHTML='<div class="order-empty"><div class="order-empty-icon">🛒</div><div>장바구니가 비어있습니다</div></div>'; return; }
  const total = items.reduce((s,i)=>s+(parseInt((i.price||'0').replace(/,/g,''))*（i.qty||1)),0);
  el.innerHTML = items.map(i=>`
    <div class="cart-item">
      <div class="cart-icon">${i.icon||'📦'}</div>
      <div class="cart-info">
        <div class="cart-name">${i.name}</div>
        <div class="cart-opt">${i.selectedOpt||''} ${i.selectedColor?'· '+i.selectedColor:''} · ${i.qty||1}개</div>
      </div>
      <div class="cart-price">₩${i.price||0}</div>
      <button class="cart-rm">✕</button>
    </div>
  `).join('') + `
    <div class="cart-total">
      <span class="cart-total-label">합계</span>
      <span class="cart-total-price">₩${total.toLocaleString()}</span>
    </div>
    <button class="checkout-btn">결제하기</button>
  `;
}

window.renderCart = renderCart;

function saveProfile() {
  showToast('✅ 회원 정보가 저장되었습니다');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// profile 섹션에 현재 정보 채우기
setTimeout(()=>{
  if(window._user){
    document.getElementById('editName').value = window._user.displayName||'';
    document.getElementById('editEmail').value = window._user.email||'';
  }
},1500);
</script>
</body>
</html>
